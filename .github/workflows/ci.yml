name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run site:check
      - run: npm run site:build
      - run: node scripts/prepare-publish.mjs
      - name: Check published package
        run: cd publish && npx --yes @arethetypeswrong/cli@latest --pack

  react-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        react-version: [18.3.1, 19.3.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install React ${{ matrix.react-version }}
        run: npm install --no-save --legacy-peer-deps react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
      - run: npm run typecheck
      - run: npm test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e:run
      - run: npm run test:next:run
